<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Isometric Face Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Glowing Core Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Radar Telemetry Orbit -->
  <circle cx="32" cy="32" r="23" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.45"/>
  <circle cx="32" cy="32" r="16" stroke="#818cf8" stroke-width="1" stroke-dasharray="2 3" opacity="0.35"/>

  <!-- Autonomous 3D Freight Cube -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="32,14 46,22 32,30 18,22" fill="url(#topFace)"/>
    <!-- Left Face -->
    <polygon points="18,22 32,30 32,46 18,38" fill="url(#leftFace)"/>
    <!-- Right Face -->
    <polygon points="32,30 46,22 46,38 32,46" fill="url(#rightFace)"/>
    <!-- Edge Accents -->
    <polyline points="18,22 32,30 46,22" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="32" y1="30" x2="32" y2="46" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
  </g>

  <!-- Center Telemetry Beacon -->
  <circle cx="32" cy="30" r="3" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="32" cy="30" r="1.5" fill="#38bdf8"/>

  <!-- Milestone Node Blips -->
  <circle cx="46" cy="22" r="2" fill="#34d399"/>
  <circle cx="18" cy="38" r="2" fill="#f87171"/>
</svg>
